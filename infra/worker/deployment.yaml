apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-task-platform
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: REGISTRY/ai-task-worker:IMAGE_TAG
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: ai-task-config
        - secretRef:
            name: ai-task-secret
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import redis
              import os
              r = redis.Redis(host=os.getenv('REDIS_HOST'), port=int(os.getenv('REDIS_PORT', 6379)))
              r.ping()
          initialDelaySeconds: 30
          periodSeconds: 30
